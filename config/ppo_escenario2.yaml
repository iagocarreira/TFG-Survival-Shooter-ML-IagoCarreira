behaviors:
  Shooter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.005          # entropía: fomenta exploración inicial
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:              # ayuda a explorar el mapa para encontrar monedas
        gamma: 0.99
        strength: 0.02
        network_settings:
          hidden_units: 128
        learning_rate: 3.0e-4

    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 5000

# ──────────────────────────────────────────────────────────────────────────────
# Curriculum de dificultad progresiva
#
# coin_spawn_radius controla dónde reaparece la moneda tras recogerla:
#   Fase 1 "CoinCerca"  → radio 3 u  (moneda siempre a ≤3 u del jugador)
#   Fase 2 "CoinMedia"  → radio 8 u  (un poco más lejos)
#   Fase 3 "CoinLibre"  → -1         (spawn aleatorio en todo el mapa, normal)
#
# normal/big_enemy_spawn_rate:
#   Empiezan desactivados (9999/9999) y se activan cuando el agente ya sabe
#   recoger monedas consistentemente (reward > 50 con moneda en posición libre).
# ──────────────────────────────────────────────────────────────────────────────
environment_parameters:

  coin_spawn_radius:
    curriculum:
      - name: CoinCerca
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100    # al menos 100 episodios en esta fase
          threshold: 60.0           # episodio típico: −50 base + 100 moneda ≈ 50+
        value: 3.0                  # moneda aparece a ≤3 unidades del jugador
      - name: CoinMedia
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 40.0           # más difícil: moneda más lejos
        value: 8.0
      - name: CoinLibre
        value: -1.0                 # spawn aleatorio normal

  normal_enemy_spawn_rate:
    curriculum:
      - name: SinEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 50.0           # agente recoge moneda libre antes de añadir enemigos
        value: 9999.0
      - name: PocosEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 20.0
        value: 8.0
      - name: NormalEnemigos
        value: 5.0

  big_enemy_spawn_rate:
    curriculum:
      - name: SinEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 50.0
        value: 9999.0
      - name: PocosEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 20.0
        value: 20.0
      - name: NormalEnemigos
        value: 12.0
