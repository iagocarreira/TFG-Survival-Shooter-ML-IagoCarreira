behaviors:
  Shooter:
    trainer_type: dqn
    hyperparameters:
      learning_rate: 0.0003
      learning_rate_schedule: linear
      batch_size: 128
      buffer_size: 50000
      buffer_init_steps: 1000
      tau: 0.005
      steps_per_update: 4.0
      
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        
    checkpoint_interval: 50000
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000
    
  