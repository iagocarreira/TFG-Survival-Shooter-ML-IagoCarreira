behaviors:
  Shooter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      beta: 0.008
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        network_settings:
          hidden_units: 128
        learning_rate: 3.0e-4

    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 5000

# PPO_Aimbot - one-shot kill, sin limite de pasos por episodio
#
# En Unity ANTES de lanzar:
#   - Current Mode           = PPO_Aimbot
#   - Behavior Type          = Default (sin modelo)
#   - Max Step               = 0  (sin limite por episodio)
#   - Continuous Action Size = 2  (move_h, move_v)
#   - Discrete Branch 0      = 2  (0=no disparar / 1=disparar)
#   - attackDamage (Enemy)   = 100 (one-shot kill)
#   - RayPerceptionSensor3D  = ACTIVADO
#
# Recompensas:
#   +100   por moneda recogida
#   +200   bonus victoria (5 monedas)
#   -9999  por morir
#   -0.02  disparo fallado (sin impactar enemigo)
#   -0.01  por paso
#
# Curriculum:
#   Fase 1 - CoinCerca/SinEnemigos  (reward > 60): aprende a coger monedas
#   Fase 2 - CoinCerca/PocosEnemigos (reward > 30): aprende que morir es fatal
#   Fase 3 - CoinLibre/TodosEnemigos: tarea completa

environment_parameters:

  coin_spawn_radius:
    curriculum:
      - name: CoinCerca
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 60.0
        value: 3.0
      - name: CoinCercaEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 30.0
        value: 3.0
      - name: CoinLibre
        value: -1.0

  normal_enemy_spawn_rate:
    curriculum:
      - name: SinEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 60.0
        value: 9999.0
      - name: PocosEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 30.0
        value: 10.0
      - name: TodosEnemigos
        value: 5.0

  big_enemy_spawn_rate:
    curriculum:
      - name: SinEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 60.0
        value: 9999.0
      - name: PocosEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 30.0
        value: 9999.0
      - name: TodosEnemigos
        value: 12.0
