behaviors:
  Shooter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512           # episodios más cortos con one-shot → batch más grande para variedad
      buffer_size: 8192
      learning_rate: 3.0e-4
      beta: 0.008               # más entropía: sobrevivir requiere más exploración
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:                # explorar el mapa para encontrar monedas y evadir enemigos
        gamma: 0.99
        strength: 0.02
        network_settings:
          hidden_units: 128
        learning_rate: 3.0e-4

    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 4000000
    time_horizon: 128
    summary_freq: 5000

# ──────────────────────────────────────────────────────────────────────────────
# Configuración: PPO con enemigos one-shot
#
# En Unity antes de lanzar:
#   - attackDamage en el prefab Enemy → 100  (one-shot kill)
#   - Current Mode          = PPO_Continuous
#   - Behavior Type         = Default  (sin modelo)
#   - RayPerceptionSensor3D ACTIVADO
#
# Escala de recompensas:
#   +100  por moneda recogida
#   +200  bonus victoria (5 monedas)
#   −200  por morir  → morir = perder 2 monedas → el agente aprende a temer morir
#   −0.01 por paso   → incentiva eficiencia
#
# Curriculum:
#   Fase 1 — Moneda cerca, sin enemigos:
#     El agente aprende el objetivo (coger monedas) sin presión.
#   Fase 2 — Moneda cerca, pocos enemigos:
#     Introduce la amenaza con moneda fácil de coger;
#     el agente aprende que puede morir y que morir es muy costoso.
#   Fase 3 — Moneda libre, todos los enemigos:
#     Tarea completa: navegar el mapa, sobrevivir y coger 5 monedas.
# ──────────────────────────────────────────────────────────────────────────────
environment_parameters:

  coin_spawn_radius:
    curriculum:
      - name: CoinCerca
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 60.0       # aprende a coger monedas sin enemigos
        value: 3.0
      - name: CoinCercaEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 30.0       # coger moneda cerca sobreviviendo: más difícil
        value: 3.0              # moneda sigue cerca mientras aprende a esquivar
      - name: CoinLibre
        value: -1.0             # mapa completo

  normal_enemy_spawn_rate:
    curriculum:
      - name: SinEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 60.0       # sincronizado con CoinCerca
        value: 9999.0
      - name: PocosEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 30.0
        value: 10.0             # enemigos pero no agobiantes
      - name: TodosEnemigos
        value: 5.0

  big_enemy_spawn_rate:
    curriculum:
      - name: SinEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 60.0
        value: 9999.0
      - name: PocosEnemigos
        completion_criteria:
          measure: reward
          behavior: Shooter
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 30.0
        value: 9999.0           # sin big enemies mientras aprende a esquivar normales
      - name: TodosEnemigos
        value: 12.0
